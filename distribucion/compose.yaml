# Magister Studio a partir de las imágenes ya hechas de ghcr.io: no construye nada.
#
# Es el compose de los paquetes Magister-Mac.zip y Magister-Windows.zip (scripts/paquetes.sh lo copia a su carpeta
# sistema/, junto a magister.env, crear_bases.sql y seccomp-chromium.json). Los secretos van en ../secretos, al lado
# del arrancador. El arrancador lo usa desde sistema/: docker compose -f compose.yaml pull, y luego up -d.
# El compose.yaml de la raíz del repo es el de desarrollo (con build:) y sigue igual.
#
# Mismo nombre de proyecto, servicios y volúmenes que el de la raíz: quien ya usaba Magister con Docker conserva sus
# datos. MAGISTER_ETIQUETA elige otra versión de las imágenes (por defecto, «estable»: la última versión publicada).
name: magister-studio

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: ${MAGISTER_DOCKER_CONTENEDOR_DB:-magister-studio-db}
    environment:
      POSTGRES_USER: magister
      # Solo cuenta la primera vez (volumen vacío). El arrancador le pasa la de secretos/postgres_password.
      POSTGRES_PASSWORD: ${MAGISTER_DOCKER_DB_CLAVE:-magister}
      POSTGRES_DB: magister
    ports:
      - "127.0.0.1:${MAGISTER_DOCKER_PUERTO_DB:-5433}:5432"
    volumes:
      - magister-studio-datos:/var/lib/postgresql/data
      - ./crear_bases.sql:/docker-entrypoint-initdb.d/10-crear_bases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U magister -d magister"]
      interval: 2s
      retries: 15

  api:
    image: ghcr.io/portaltocoding/magister-studio-api:${MAGISTER_ETIQUETA:-estable}
    pull_policy: missing
    env_file: magister.env
    secrets: [claude_token, postgres_password, canario]
    init: true
    security_opt:
      - seccomp=./seccomp-chromium.json
    volumes:
      - magister-studio-api:/datos
      - magister-studio-copias:/copias
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/salud')\""]
      interval: 10s
      retries: 10
      start_period: 180s

  web:
    image: ghcr.io/portaltocoding/magister-studio-web:${MAGISTER_ETIQUETA:-estable}
    pull_policy: missing
    ports:
      - "127.0.0.1:${MAGISTER_DOCKER_PUERTO_WEB:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

secrets:
  claude_token:
    file: ../secretos/claude_token
  postgres_password:
    file: ../secretos/postgres_password
  canario:
    file: ../secretos/canario

volumes:
  magister-studio-datos:
  magister-studio-api:
  magister-studio-copias:
