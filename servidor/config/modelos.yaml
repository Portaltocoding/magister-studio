# Qué motor y modelo usa cada tarea del tutor (Parte VI, «El enrutador»).
# `defecto` es MAGISTER_MODELO. Una variable MAGISTER_MODELO_<TAREA>=motor:modelo manda sobre esto.
# datos_personales: la tarea lleva datos tuyos; nunca se enruta a un motor externo_gratuito.

motores:
  cli: {externo_gratuito: false}
  eco: {externo_gratuito: false}

tareas:
  conversar: {motor: cli, modelo: defecto, datos_personales: true}
  explicar:  {motor: cli, modelo: defecto, datos_personales: true}
  corregir:  {motor: cli, modelo: defecto, datos_personales: true}
  generar:   {motor: cli, modelo: defecto, datos_personales: false}
  planificar: {motor: cli, modelo: defecto, datos_personales: true}
  extraer:   {motor: cli, modelo: haiku, datos_personales: true}
  juez:      {motor: cli, modelo: haiku, datos_personales: false}

# Qué tarea es cada plantilla de prompt.
prompts:
  conversar: conversar
  responder: conversar
  diagnostico: conversar
  negociar: conversar
  explicar_fallo: conversar
  extraer_perfil: extraer
  reescribir: extraer
  conceptos: extraer
  planificar: planificar
  corrector: corregir
  corrector_examen: corregir
  apuntes_contrato: generar
  apuntes_bloque: generar
  apuntes_refinar: generar
  preguntas: generar
  preguntas_test: generar
  diapositivas: generar
  guion: generar
  juez_tono: juez
  juez_completitud: juez

# Presupuesto diario por tarea en segundo plano (tokens de entrada más salida); al pasarlo se aplaza.
presupuesto_dia_tokens:
  juez: 2000000
  generar: 4000000
