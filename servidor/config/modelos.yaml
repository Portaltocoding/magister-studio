# Qué motor y modelo usa cada tarea del tutor (Parte VI, «El enrutador»).
# `defecto` es MAGISTER_MODELO. Una variable MAGISTER_MODELO_<TAREA>=motor:modelo manda sobre esto.
# datos_personales: la tarea lleva datos tuyos; nunca se enruta a un motor externo_gratuito.

motores:
  cli: {externo_gratuito: false}
  eco: {externo_gratuito: false}

tareas:
  conversar: {motor: cli, modelo: defecto, datos_personales: true, plazo_s: 300, reintentos: 1}
  explicar:  {motor: cli, modelo: defecto, datos_personales: true, plazo_s: 300, reintentos: 1}
  corregir:  {motor: cli, modelo: defecto, datos_personales: true, plazo_s: 180, reintentos: 1}
  generar:   {motor: cli, modelo: defecto, datos_personales: false, plazo_s: 420, reintentos: 1}
  planificar: {motor: cli, modelo: defecto, datos_personales: true, plazo_s: 240, reintentos: 1}
  extraer:   {motor: cli, modelo: haiku, datos_personales: true, plazo_s: 90, reintentos: 2}
  juez:      {motor: cli, modelo: haiku, datos_personales: false, plazo_s: 150, reintentos: 1}
  # Los turnos de la llamada de voz. Se probó Haiku (18-11-2026): no arrancaba antes (unos 3,5 s son del propio
  # claude -p, sea cual sea el modelo) y corregía peor, así que va con el modelo de siempre. La tarea se mantiene
  # para poder cambiarlo aquí y para que el juez de tono no puntúe turnos hablados.
  llamada:   {motor: cli, modelo: defecto, datos_personales: true, plazo_s: 90, reintentos: 1}
  # El asesor (la mascota flotante): preguntas cortas sobre la pantalla que tienes abierta. Haiku gasta mucho menos
  # cuota; el arranque de claude -p es el mismo, así que lo que lo hace instantáneo son las preguntas frecuentes, que se
  # contestan en la propia pantalla sin llegar aquí (web/src/componentes/faqs.ts).
  asesor:    {motor: cli, modelo: haiku, datos_personales: true, plazo_s: 60, reintentos: 1}

# Plazos: `plazo_s` de cada tarea es lo que puede durar como mucho una llamada (aunque siga mandando señales); pasado,
# se corta y se reintenta `reintentos` veces. Aquí, los prompts con un plazo propio, más corto que el de su tarea.
# Todos los intentos cuentan para el freno de llamadas (cerebro/freno.py): un reintento nunca se vuelve un bucle.
plazos_prompt:
  diagrama_chat: 90
  diagrama_apartado: 90
  adelanto: 40
  guion_grafico: 420
  proyecto_arquitectura: 90  # el dibujo es decorativo: no puede tener al proyecto esperando

# Qué tarea es cada plantilla de prompt.
prompts:
  conversar: conversar
  responder: conversar
  diagnostico: conversar
  negociar: conversar
  explicar_fallo: conversar
  reajuste: conversar
  adelanto: conversar
  materia_elegir: extraer
  extraer_perfil: extraer
  reescribir: extraer
  conceptos: extraer
  planificar: planificar
  corrector: corregir
  corrector_examen: corregir
  apuntes_contrato: generar
  apuntes_bloque: generar
  apuntes_refinar: generar
  preguntas: generar
  preguntas_test: generar
  diapositivas: generar
  guion: generar
  guion_grafico: generar
  diagrama_apartado: generar
  diagrama_chat: explicar
  mapa: generar
  proyecto_roadmap: generar
  proyecto_nivel: generar
  proyecto_arquitectura: generar
  # Los cambios que propone el asesor: escribe pasos de proyecto, así que el modelo de siempre, no el del asesor.
  asesor_cambio: planificar
  juez_tono: juez
  juez_completitud: juez
  # El research: el mismo modelo que antes de tener plantilla (sin nombre caía en conversar). El juez ve tu nivel, tu
  # objetivo y tus preferencias: datos personales, nunca a un motor externo gratuito.
  research_consultas: conversar
  research_juez: conversar
  # Si una lección necesita fuentes (ADR-0021, nota del 19-11-2026): el research automático no busca una lección sin
  # etiqueta «por si acaso», la etiqueta antes con el modelo barato. Lo mide `evals.cuando_research`, con este mismo modelo.
  cuando_research: extraer

# Presupuesto diario por tarea en segundo plano (tokens de entrada más salida); al pasarlo se aplaza.
presupuesto_dia_tokens:
  juez: 2000000
  generar: 4000000
