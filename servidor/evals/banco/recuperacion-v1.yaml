# Juego fijo de preguntas para comprobar el índice de tu biblioteca (protocolo de reindexado y de consulta).
# Preguntas en español, como las harías tú, sobre documentos que están en inglés: es justo el caso que fallaba.
# Cada pregunta dice qué documento debe salir (por un trozo de su título) y, si se sabe, en qué sección (por un
# trozo de su encabezado). Las de `sin_fuentes` no deben recuperar nada: son de otros temas.
# No se evalúa por id de fragmento, para que el juego sirva antes y después de reindexar.
#
#   uv run python -m evals.recuperacion            (desde servidor/; solo modelos locales, no gasta cuota)

version: 1
preguntas:
  - pregunta: ¿Los delirios son creencias de verdad o son otra cosa?
    documento: Delusion
    seccion: Are delusions beliefs
  - pregunta: ¿Qué diferencia hay entre las teorías de un factor y las de dos factores sobre cómo se forma un delirio?
    documento: Delusion
    seccion: One-factor, two-factor
  - pregunta: ¿Qué es el error de predicción y cómo explicaría un delirio?
    documento: Delusion
    seccion: One-factor, two-factor
  - pregunta: ¿Cómo se define un delirio y qué problemas tiene esa definición?
    documento: Delusion
    seccion: Defining delusion
  - pregunta: ¿Qué tipos de delirio se distinguen?
    documento: Delusion
    seccion: Types of delusion
  - pregunta: ¿Son irracionales los delirios?
    documento: Delusion
    seccion: Are delusions irrational
  - pregunta: ¿En qué se parecen los delirios al autoengaño o a creer en teorías de la conspiración?
