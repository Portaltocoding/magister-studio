# ¿Hace falta buscar fuentes para esta lección? (ADR-0021, evals/cuando_research.py)
# Cada lección lleva la etiqueta que se espera, puesta a mano con su porqué:
#   no             conocimiento básico y estable que cualquier modelo explica bien
#   conviene       una buena fuente mejora la explicación
#   imprescindible lo que cambia o caduca, lo muy especializado, lo que exige cita o el temario concreto de un curso
# El fallo caro es «no» donde se esperaba «imprescindible»: la eval lo cuenta aparte.
# v1: revísalas tú; si cambias una etiqueta, sube la versión del fichero (v2) para no mezclar medidas.

