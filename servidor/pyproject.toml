[project]
name = "magister"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Carlos Portal", email = "165586784+Portaltocoding@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "ddgs>=9.16.1",
    "fastapi>=0.162.0",
    "fsrs>=6.3.3",
    "httpx>=0.28.1",
    "langgraph>=1.2.22",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pgvector>=0.5.1",
    "pillow>=13.0.0",
    "pydantic-settings>=2.16.2",
    "pymupdf>=2.1",
    "python-multipart>=0.0.33",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.3.0",
    "sqlalchemy[asyncio]>=2.1.8",
    # Ya venía con sentence-transformers; se declara para poder elegir su índice abajo.
    "torch>=2.15.0",
    "trafilatura>=2.3.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
magister = "magister.cli:main"
magister-trabajador = "magister.trabajos.trabajador:main"

[build-system]
requires = ["uv_build>=0.11.13,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "anyio>=4.16.0",
    "httpx>=0.28.1",
    "hypothesis>=6.170.15",
    "pytest>=9.2.0",
]

# En Linux (la imagen Docker) torch sale del índice solo-CPU de PyTorch: sin CUDA,
# sin nvidia-* ni triton. En Windows y macOS sigue saliendo de PyPI, como antes.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["."]
