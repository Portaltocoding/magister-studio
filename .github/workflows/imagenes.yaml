# Las imágenes de Magister en ghcr.io (api y web, para amd64 y arm64) y, en cada etiqueta v*, los paquetes
# Magister-Windows.zip y Magister-Mac.zip en la Release (con Docker) y Magister-Windows-sin-Docker.zip y
# Magister-Mac-sin-Docker.zip (sin Docker: llevan el código y se montan en los jobs pagina, nativo-mac y nativo-windows).
#
#   push a main  -> :latest y :sha-<corto>
#   etiqueta v*  -> :<versión> (1.2.3), :<mayor>.<menor> y :estable (la que usan los paquetes; no en las -rc)
#
# Cada arquitectura se construye en su runner nativo (ubuntu-24.04 y ubuntu-24.04-arm, sin QEMU) y se sube por
# digest; luego `unir` junta los dos digests en una sola etiqueta multiarquitectura.
name: imagenes

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGEN_API: ghcr.io/portaltocoding/magister-studio-api
  IMAGEN_WEB: ghcr.io/portaltocoding/magister-studio-web

concurrency:
  group: imagenes-${{ github.ref }}
  cancel-in-progress: false

jobs:
  construir:
    name: construir (${{ matrix.imagen }}, ${{ matrix.arq }})
    strategy:
      fail-fast: true
      matrix:
        imagen: [api, web]
        arq: [amd64, arm64]
        include:
          - arq: amd64
            runner: ubuntu-24.04
          - arq: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Hacer sitio en el disco (la imagen de la API, con los modelos, pasa de 4 GB)
        if: matrix.imagen == 'api'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Elegir imagen y contexto
        id: cual
        run: |
          if [ "${{ matrix.imagen }}" = "api" ]; then
            echo "nombre=$IMAGEN_API" >> "$GITHUB_OUTPUT"
            echo "contexto=./servidor" >> "$GITHUB_OUTPUT"
            echo "contextos=docs=./docs" >> "$GITHUB_OUTPUT"
          else
            echo "nombre=$IMAGEN_WEB" >> "$GITHUB_OUTPUT"
            echo "contexto=./web" >> "$GITHUB_OUTPUT"
            echo "contextos=" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y subir (por digest)
        id: construir
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ steps.cual.outputs.contexto }}
          build-contexts: ${{ steps.cual.outputs.contextos }}
          platforms: linux/${{ matrix.arq }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=magister-studio-${{ matrix.imagen }}
          outputs: type=image,name=${{ steps.cual.outputs.nombre }},push-by-digest=true,name-canonical=true,push=true
          # La caché va al propio registro (la de GitHub Actions tiene 10 GB y la API sola casi los llena).
          cache-from: type=registry,ref=${{ steps.cual.outputs.nombre }}:cache-${{ matrix.arq }}
          cache-to: type=registry,ref=${{ steps.cual.outputs.nombre }}:cache-${{ matrix.arq }},mode=max
          provenance: false

      - name: Guardar el digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.construir.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.imagen }}-${{ matrix.arq }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  unir:
    name: unir (${{ matrix.imagen }})
    needs: construir
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        imagen: [api, web]
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-${{ matrix.imagen }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Nombre de la imagen
        id: cual
        run: |
          if [ "${{ matrix.imagen }}" = "api" ]; then echo "nombre=$IMAGEN_API" >> "$GITHUB_OUTPUT"
          else echo "nombre=$IMAGEN_WEB" >> "$GITHUB_OUTPUT"; fi

      - name: Etiquetas
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ steps.cual.outputs.nombre }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=estable,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}

      - name: Crear la etiqueta multiarquitectura
        working-directory: ${{ runner.temp }}/digests
        env:
          NOMBRE: ${{ steps.cual.outputs.nombre }}
        run: |
          etiquetas=$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          test -n "$etiquetas" || { echo "No hay ninguna etiqueta que poner"; exit 1; }
          # shellcheck disable=SC2086
          docker buildx imagetools create $etiquetas \
            --annotation "index:org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --annotation "index:org.opencontainers.image.description=Magister Studio (${{ matrix.imagen }})" \
            $(printf "$NOMBRE@sha256:%s " *)

      - name: Comprobar que trae amd64 y arm64
        run: |
          primera=$(jq -r '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          docker buildx imagetools inspect "$primera"
          docker buildx imagetools inspect --raw "$primera" | jq -e '[.manifests[].platform.architecture] | (index("amd64") != null and index("arm64") != null)'

  paquetes:
    name: paquetes de la Release
    needs: unir
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Montar Magister-Windows.zip y Magister-Mac.zip
        run: bash scripts/paquetes.sh dist

      - name: Comprobar el compose del paquete
        run: |
          cd dist/Magister-Mac/sistema
          mkdir -p ../secretos && touch ../secretos/claude_token ../secretos/postgres_password ../secretos/canario
          docker compose -f compose.yaml config --quiet
          rm -rf ../secretos

      - name: Publicar en la Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ETIQUETA: ${{ github.ref_name }}
        run: |
          if ! gh release view "$ETIQUETA" >/dev/null 2>&1; then
            previa=()
            case "$ETIQUETA" in *-*) previa=(--prerelease) ;; esac
            gh release create "$ETIQUETA" "${previa[@]}" --verify-tag --title "Magister $ETIQUETA" --generate-notes \
              --notes "Para instalar, con Docker: Mac, Magister-Mac.zip (o la línea de Terminal de docs/instalar.md); Windows, Magister-Windows.zip. Sin Docker: Magister-Mac-sin-Docker.zip y Magister-Windows-sin-Docker.zip. Cuál elegir: docs/instalar.md."
          fi
          gh release upload "$ETIQUETA" dist/Magister-Windows.zip dist/Magister-Mac.zip --clobber

  # ===== Paquetes SIN Docker (Magister-Mac-sin-Docker.zip y Magister-Windows-sin-Docker.zip) =====
  # No dependen de las imágenes: llevan el código y la página. Corren en paralelo con la construcción de las imágenes.
  pagina:
    name: página (web/dist) para los paquetes sin Docker
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Construir la página
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pagina-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 1

  nativo-mac:
    name: paquete Mac sin Docker
    needs: pagina
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pagina-dist
          path: web/dist

      - name: Revisar los arrancadores
        run: |
          bash -n distribucion/nativo/magister-nativo.sh
          bash -n distribucion/nativo/Magister-sin-Docker.command
          bash -n distribucion/nativo/Parar-sin-Docker.command
          bash -n instalar-mac-sin-docker.sh

      - name: Montar Magister-Mac-sin-Docker.zip
        run: bash scripts/paquetes-nativos.sh mac dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zip-mac-sin-docker
          path: dist/Magister-Mac-sin-Docker.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  nativo-windows:
    name: paquete Windows sin Docker
    needs: pagina
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pagina-dist
          path: web/dist

      # Postgres 16 portable (EDB) + pgvector construido con MSVC (nmake), ffmpeg, Piper con sus voces, uv, Node,
      # pandoc, poppler y Git portable. El propio script comprueba cada pieza (initdb, CREATE EXTENSION vector,
      # libx264, «Hola» con cada voz).
      - name: Descargar y construir las herramientas
        run: bash scripts/herramientas-windows.sh "$RUNNER_TEMP/herramientas-windows"

      - name: Montar Magister-Windows-sin-Docker.zip
        run: bash scripts/paquetes-nativos.sh windows dist "$RUNNER_TEMP/herramientas-windows"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zip-windows-sin-docker
          path: dist/Magister-Windows-sin-Docker.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publicar-nativos:
    name: publicar los paquetes sin Docker
    needs: [paquetes, nativo-mac, nativo-windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: zip-*-sin-docker
          path: ${{ runner.temp }}/zips
          merge-multiple: true

      # `paquetes` ya creó la Release (si faltaba) con los dos paquetes de Docker: aquí se añaden los otros dos.
      - name: Subir a la Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ETIQUETA: ${{ github.ref_name }}
        run: |
          ls -l "$RUNNER_TEMP/zips"
          gh release upload "$ETIQUETA" "$RUNNER_TEMP/zips/Magister-Mac-sin-Docker.zip" "$RUNNER_TEMP/zips/Magister-Windows-sin-Docker.zip" --clobber
